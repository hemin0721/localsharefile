[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "localsharefile"
version = "0.3.0"
description = "LocalShareFile —— 局域网文件共享工具：多目录共享、网页远程配置、FTP 式批量下载、拖拽上传、终端 CLI（lsf）、开机自启动"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "hemin0721" }]
keywords = ["lan", "share", "file", "server", "http", "transfer", "ftp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: File Sharing",
]

[project.urls]
Homepage = "https://github.com/hemin0721/localsharefile"
Repository = "https://github.com/hemin0721/localsharefile"
Issues = "https://github.com/hemin0721/localsharefile/issues"

[project.scripts]
localsharefile = "localsharefile.cli:main"
lsf = "localsharefile.client:main"

[tool.setuptools]
packages = ["localsharefile"]
